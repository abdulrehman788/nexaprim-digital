services:
  web:
    build:
      context: .
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://expandova.com}
    image: expandova-web:latest
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://expandova.com}
      # SQLite on the named volume (override in .env if you use Postgres)
      DATABASE_URL: ${DATABASE_URL:-file:/app/data/prod.db}
    ports:
      # Bind to localhost only — Nginx on the host terminates TLS
      - "127.0.0.1:3000:3000"
    volumes:
      - expandova_data:/app/data
      - expandova_uploads:/app/public/images/uploads
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s

volumes:
  expandova_data:
  expandova_uploads:
