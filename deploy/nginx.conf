# Upstream Next.js app (Docker Compose binds 127.0.0.1:3000)
# Replace expandova.com with your domain. After install:
#   sudo ln -s /var/www/expandova/deploy/nginx.conf /etc/nginx/sites-enabled/expandova
#   sudo certbot --nginx -d expandova.com -d www.expandova.com

upstream expandova_next {
    server 127.0.0.1:3000;
    keepalive 64;
}

# Redirect apex ↔ www as you prefer (this sends www → apex)
server {
    listen 80;
    listen [::]:80;
    server_name www.expandova.com;
    return 301 https://expandova.com$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name expandova.com;

    # Certbot will replace this block with HTTPS — keep for initial HTTP challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name expandova.com;

    # Managed by Certbot (paths below are placeholders until certbot runs)
    # ssl_certificate     /etc/letsencrypt/live/expandova.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/expandova.com/privkey.pem;
    # include /etc/letsencrypt/options-ssl-nginx.conf;
    # ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 8m;

    # Security headers (app also sets CSP; these are belt-and-suspenders)
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # Long-cache hashed Next assets
    location /_next/static/ {
        proxy_pass http://expandova_next;
        proxy_http_version 1.1;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /images/ {
        proxy_pass http://expandova_next;
        proxy_http_version 1.1;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://expandova_next;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
        proxy_buffering on;
    }
}
