# HTTP-only bootstrap for first deploy.
# Certbot (--nginx) injects ACME challenge routes itself — do NOT add a custom
# /.well-known/ location here or challenges return 404.
#
# After install:
#   sudo certbot --nginx -d expandova.com -d www.expandova.com
#
# If Certbot already upgraded this file to HTTPS, merge the location blocks below
# into the `listen 443 ssl` server block as well.

upstream expandova_next {
    server 127.0.0.1:3000;
    keepalive 64;
}

server {
    listen 80;
    listen [::]:80;
    server_name expandova.com www.expandova.com;

    client_max_body_size 8m;

    # Fingerprinted Next build assets
    location /_next/static/ {
        proxy_pass http://expandova_next;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # Pre-optimized local media — long cache, no revalidation tax
    location /images/ {
        proxy_pass http://expandova_next;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    location /icons/ {
        proxy_pass http://expandova_next;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # Browser-cache any remaining Next image optimizer responses
    location /_next/image {
        proxy_pass http://expandova_next;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        add_header Cache-Control "public, max-age=2592000, immutable";
        access_log off;
    }

    location / {
        proxy_pass http://expandova_next;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
        proxy_buffering on;
    }
}
