# HTTP-only bootstrap for first deploy.
# Certbot will add the 443/ssl server blocks automatically:
#   sudo certbot --nginx -d expandova.com -d www.expandova.com
#
# Do NOT enable "listen 443 ssl" here until certificates exist — nginx -t will fail.

upstream expandova_next {
    server 127.0.0.1:3000;
    keepalive 64;
}

server {
    listen 80;
    listen [::]:80;
    server_name expandova.com www.expandova.com;

    client_max_body_size 8m;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    location /_next/static/ {
        proxy_pass http://expandova_next;
        proxy_http_version 1.1;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /images/ {
        proxy_pass http://expandova_next;
        proxy_http_version 1.1;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://expandova_next;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
        proxy_buffering on;
    }
}
